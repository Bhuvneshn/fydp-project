<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email · FYDP Project</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Check your email</h1>
    <p class="subtitle">We sent a 6-digit code to <strong id="email">your email</strong>.</p>
    <form id="verify-form">
      <label>Verification code
        <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      </label>
      <p class="error"></p>
      <button type="submit">Verify</button>
      <button type="button" class="secondary" id="resend">Resend code</button>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    api('/me')
      .then(({ user }) => {
        if (user.emailVerified) location.replace('/dashboard');
        document.getElementById('email').textContent = user.email;
      })
      .catch(() => location.replace('/login'));

    const form = document.getElementById('verify-form');
    handleForm(form, async ({ code }) => {
      await api('/verify', { code });
      location.href = '/dashboard';
    });

    document.getElementById('resend').addEventListener('click', async () => {
      const errorEl = form.querySelector('.error');
      try {
        await api('/resend-code', {});
        errorEl.textContent = 'A new code has been sent.';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
