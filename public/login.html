<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · FYDP Project</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Log in</h1>
    <p class="subtitle">Use your @uwaterloo.ca account.</p>
    <form id="login-form">
      <label>Email
        <input name="email" type="email" placeholder="you@uwaterloo.ca" required autocomplete="email">
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p class="error"></p>
      <button type="submit">Log in</button>
    </form>
    <p class="footer">No account? <a href="/register">Create one</a></p>
  </main>
  <script src="/app.js"></script>
  <script>
    handleForm(document.getElementById('login-form'), async ({ email, password }) => {
      if (!isUWaterlooEmail(email)) throw new Error('Only @uwaterloo.ca email addresses are allowed.');
      const { verificationRequired } = await api('/login', { email, password });
      location.href = verificationRequired ? '/verify' : '/dashboard';
    });
  </script>
</body>
</html>
