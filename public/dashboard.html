<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · FYDP Project</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>FYDP Project</h1>
    <p class="subtitle">Signed in as <strong id="email">…</strong></p>
    <p>Welcome! The rest of the app goes here.</p>
    <button type="button" class="secondary" id="logout">Log out</button>
  </main>
  <script src="/app.js"></script>
  <script>
    api('/me')
      .then(({ user, verificationRequired }) => {
        if (verificationRequired && !user.emailVerified) location.replace('/verify');
        document.getElementById('email').textContent = user.email;
      })
      .catch(() => location.replace('/login'));

    document.getElementById('logout').addEventListener('click', async () => {
      await api('/logout', {});
      location.href = '/login';
    });
  </script>
</body>
</html>
